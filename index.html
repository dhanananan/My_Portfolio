    />

    <link rel="canonical" href="https://dhananjayaraut.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dhananjaya Raut" />
    <meta property="og:title" content="Dhananjaya Raut — UI/UX Designer" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Body/heading type is the system-font stack (-apple-system etc, see
         index.css) — real San Francisco on Apple devices, each OS's own
         native UI font elsewhere, and no network request either way. Only
         the mono eyebrow/label face still comes from Google Fonts. -->
    <!-- The hero name's display face (Modak, self-hosted). Preloaded because
         it is above the fold and `font-display: block` hides the name until
         it arrives; `crossorigin` is required for font preloads even on the
         same origin, or the browser fetches it twice. -->
    <link rel="preload" href="/fonts/modak-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dhananjaya Raut",
        "jobTitle": "UI/UX Designer",
        "url": "https://dhananjayaraut.com/",
        "address": { "@type": "PostalAddress", "addressCountry": "NP" },
        "knowsAbout": [
          "UX Research",

          "Design Systems",
          "Information Architecture",
          "Usability Testing",
          "Frontend Development"
        ]
